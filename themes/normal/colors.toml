# Tema "normal" — paleta monocromática atual (Adwaita dark), extraída 1:1 dos
# configs reais em 2026-08-07. Byte-perfect com o estado anterior à existência
# do theme-set: aplicar este tema não muda nenhum pixel do sistema atual.

# UI (Hyprland borders, Waybar, SwayNC, Hyprlock, Fuzzel)
background    = "#1d1d20"
surface       = "#2a2a2e"
surface_hover = "#323236"
foreground    = "#ffffff"
accent        = "#a0a0a0"
error         = "#ff6464"

# Terminal (Ghostty) — off-white mais suave que o foreground de UI
term_foreground           = "#deddda"
term_cursor               = "#deddda"
term_selection_background = "#303030"
term_selection_foreground = "#c0bfbc"

# Paleta ANSI de 16 cores (Ghostty) — Adwaita dark
color0  = "#1d1d20"
color1  = "#ed333b"
color2  = "#57e389"
color3  = "#ff7800"
color4  = "#62a0ea"
color5  = "#9141ac"
color6  = "#5bc8af"
color7  = "#deddda"
color8  = "#9a9996"
color9  = "#f66151"
color10 = "#8ff0a4"
color11 = "#ffa348"
color12 = "#99c1f1"
color13 = "#dc8add"
color14 = "#93ddc2"
color15 = "#f6f5f4"

# Integração desktop estilo Omarchy
mode = "dark"
icon_theme = "Adwaita"
gtk_theme = "adw-gtk3-dark"
gtk4_theme = "Adwaita-dark"
window_rounding = 10
border_size = 2
gaps_in = 3.5
gaps_out = 6.5

# Quickshell/SwayNC: estado commitado antes da sessão (cinza, redondo).
quick_panel_background = "#1d1d20"
quick_card_background = "#2a2a2e"
quick_hover_background = "#323236"
quick_panel_opacity = 0.90
quick_card_opacity = 0.80
quick_hover_opacity = 0.95
quick_panel_radius = 12
quick_card_radius = 10
quick_button_radius = 8
quick_switch_radius = 20
quick_box_shadow = "0 4px 24px rgba(0, 0, 0, 0.5)"
quick_clock_width = 650
quick_clock_height = 400
quick_clock_scale = 1.0
quick_clock_margin = 14
quick_clock_spacing = 10
quick_clock_left_width = 315
quick_clock_right_width = 297
quick_clock_top_height = 180
quick_clock_bottom_height = 180
quick_clock_art_size = 88
quick_clock_control_height = 28
