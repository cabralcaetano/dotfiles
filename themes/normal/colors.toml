# Tema "normal" — paleta monocromática atual (Adwaita dark), extraída 1:1 dos
# configs reais em 2026-08-07. Byte-perfect com o estado anterior à existência
# do theme-set: aplicar este tema não muda nenhum pixel do sistema atual.

# UI (Hyprland borders, Waybar, SwayNC, Hyprlock, Fuzzel)
background    = "#1d1d20"
surface       = "#2a2a2e"
surface_hover = "#323236"
foreground    = "#ffffff"
accent        = "#a0a0a0"
error         = "#ff6464"

# Terminal (Ghostty) — off-white mais suave que o foreground de UI
term_foreground           = "#deddda"
term_cursor               = "#deddda"
term_selection_background = "#303030"
term_selection_foreground = "#c0bfbc"

