; https://github.com/uiriansan/SilentSDDM/wiki/Customizing
; Customizado para bater com hypr/.config/hypr/hyprlock.conf — cinza/preto/branco,
; JetBrainsMono Nerd Font, campo de senha 280x48 arredondado, erro em vermelho,
; capslock em amarelo.

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "wallpaper_3.png"
use-background-color = false
background-color = "#000000"
blur = 24
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "JetBrainsMono Nerd Font"
font-size = 64
font-weight = 700
color = "#FFFFFF"

[LockScreen.Date]
display = true
format = "dddd, dd 'de' MMMM"
locale = "pt_BR"
font-family = "JetBrainsMono Nerd Font"
font-size = 18
font-weight = 500
color = "#A0A0A0"
margin-top = -15

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Pressione qualquer tecla"
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#A0A0A0"
paint-icon = true
spacing = 0

[LoginScreen]
background = "wallpaper_3.png"
use-background-color = false
background-color = "#000000"
blur = 24
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 140
inactive-size = 100
inactive-opacity = 0.35
active-border-size = 1
inactive-border-size = 0
active-border-color = "#A0A0A0"
inactive-border-color = "#A0A0A0"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "JetBrainsMono Nerd Font"
font-size = 14
font-weight = 600
color = "#A0A0A0"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 280
height = 48
display-icon = true
font-family = "JetBrainsMono Nerd Font"
font-size = 14
icon = "password.svg"
icon-size = 16
content-color = "#FFFFFF"
background-color = "#1D1D20"
background-opacity = 0.5
border-size = 1
border-color = "#A0A0A0"
border-radius-left = 24
border-radius-right = 24
margin-top = 16
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#1D1D20"
background-opacity = 0.5
active-background-color = "#A0A0A0"
active-background-opacity = 0.25
icon = "arrow-right.svg"
icon-size = 18
content-color = "#A0A0A0"
active-content-color = "#FFFFFF"
border-size = 1
border-color = "#A0A0A0"
border-radius-left = 24
border-radius-right = 24
margin-left = 8
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Entrando"
font-family = "JetBrainsMono Nerd Font"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#FFFFFF"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "JetBrainsMono Nerd Font"
font-size = 11
font-weight = 500
normal-color = "#A0A0A0"
warning-color = "#FFCC00"
error-color = "#FF6464"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 30
border-radius = 5
spacing = 10
font-family = "JetBrainsMono Nerd Font"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#1D1D20"
background-opacity = 0.5
active-option-background-color = "#A0A0A0"
active-option-background-opacity = 0.25
content-color = "#A0A0A0"
active-content-color = "#FFFFFF"
font-family = "JetBrainsMono Nerd Font"
border-size = 1
border-color = "#A0A0A0"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#1D1D20"
background-opacity = 0.0
active-background-opacity = 0.25
content-color = "#A0A0A0"
active-content-color = "#FFFFFF"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#1D1D20"
background-opacity = 0.0
active-background-opacity = 0.25
content-color = "#A0A0A0"
active-content-color = "#FFFFFF"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "#1D1D20"
background-opacity = 0.0
active-background-opacity = 0.25
content-color = "#A0A0A0"
active-content-color = "#FFFFFF"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#1D1D20"
background-opacity = 0.0
active-background-opacity = 0.25
content-color = "#A0A0A0"
active-content-color = "#FFFFFF"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#1D1D20"
background-opacity = 0.5
key-content-color = "#FFFFFF"
key-color = "#1D1D20"
key-opacity = 0.5
key-active-background-color = "#A0A0A0"
key-active-opacity = 0.30
selection-background-color = "#A0A0A0"
selection-content-color = "#FFFFFF"
primary-color = "#A0A0A0"
border-size = 0
border-color = "#000000"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "JetBrainsMono Nerd Font"
font-size = 11
content-color = "#FFFFFF"
background-color = "#1D1D20"
background-opacity = 0.5
border-radius = 5
disable-user = false
disable-login-button = false
