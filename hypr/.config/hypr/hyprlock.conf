# === TEMA (cores) — gerado por theme-set.sh, ver themes/ no root do repo ===
source = ~/.config/hypr/colors.conf

# === GERAL =====================================
general {
  disable_loading_bar = true
  hide_cursor = false
  grace = 0
  no_fade_in = false
}

# === BACKGROUND ================================
background {
  monitor =
  path = screenshot   # tira screenshot da tela atual
  blur_passes = 3
  blur_size = 7
  brightness = 0.6
  contrast = 1.0
  noise = 0.02
}

# === INPUT FIELD (senha) =======================
input-field {
  monitor =
  size = 280, 48
  outline_thickness = 1
  dots_size = 0.25
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent_faint
  inner_color = $bg_color
  font_color = $fg_color
  fade_on_empty = true
  placeholder_text = <span foreground="##a0a0a0"> senha...</span>
  hide_input = false
  check_color = $accent_color
  fail_color = $error_color
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = rgba(ffcc00ff)
  position = 0, -100
  halign = center
  valign = center
}

# === HORA ======================================
label {
  monitor =
  text = $TIME
  color = $fg_color
  font_size = 64
  font_family = JetBrainsMono Nerd Font
  position = 0, 200
  halign = center
  valign = center
}

# === DATA ======================================
label {
  monitor =
  text = cmd[update:60000] date +"%A, %d de %B"
  color = $accent_color
  font_size = 18
  font_family = JetBrainsMono Nerd Font
  position = 0, 130
  halign = center
  valign = center
}

# === USUÁRIO ===================================
label {
  monitor =
  text =  $USER
  color = $accent_color
  font_size = 14
  font_family = JetBrainsMono Nerd Font
  position = 0, -48
  halign = center
  valign = center
}
