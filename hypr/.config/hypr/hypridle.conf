general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = hyprlock
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
  timeout = 300           # 5 min — bloqueia a tela
  # A guarda `pidof` é obrigatória aqui, não só no lock_cmd acima: sem ela cada
  # ciclo de idle spawna um hyprlock novo por cima do anterior. Em 2026-07-25
  # havia 4 instâncias empilhadas segurando ~650 MB (162 MB de RSS cada, 0% CPU).
  on-timeout = pidof hyprlock || hyprlock
}

listener {
  timeout = 330           # 5m30 — apaga o monitor (depois do lock já estar visível)
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
  timeout = 900           # 15 min — suspende o sistema
  on-timeout = systemctl suspend
}
