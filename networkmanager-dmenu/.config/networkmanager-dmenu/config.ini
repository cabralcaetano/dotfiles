[dmenu]
dmenu_command = fuzzel --dmenu --anchor=top-right --x-margin=10 --y-margin=10 --width=28 --lines=12 --inner-pad=6 --font=JetBrainsMono\ Nerd\ Font:size=11
wifi_chars = ▂▄▆█
format = {name}
active_chars = =>
separator = ###
prompt =
list_saved = True
compact = False

[dmenu_passphrase]
obscure = False
show_pass = kitty --hold -e nmcli device wifi show-password

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 2
show_notifications = True
