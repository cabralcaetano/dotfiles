# zram-generator — swap comprimido em RAM (ARCH-35)
#
# Instalar com:
#   sudo install -Dm644 system/etc/systemd/zram-generator.conf /etc/systemd/zram-generator.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart systemd-zram-setup@zram0.service
#
# Sem `zram-size` explícito o generator usa o default min(ram/2, 4G), que numa
# máquina de 16 GB trava em 4 GB. `ram / 2` sobe pra 8 GB.
#
# Faz par obrigatório com 99-zram.conf: sem vm.swappiness = 180 o zram maior
# continua sem ser usado, só ocupa espaço de endereçamento.

[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
