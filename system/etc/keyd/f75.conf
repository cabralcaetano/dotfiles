# Aula F75 / Compx 2.4G: firmware emite Alt/Super trocados.
# Como keyd cria um teclado virtual, a correção precisa acontecer aqui,
# não só no kb_options por-device do Hyprland.

[ids]
k:3554:fa09
k:1d57:fa60

[main]
capslock = overload(nav, capslock)
leftalt = layer(meta)
leftmeta = layer(alt)
rightcontrol = compose

[nav]
h = left
j = down
k = up
l = right
