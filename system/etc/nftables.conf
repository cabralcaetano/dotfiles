#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# IPv4/IPv6 Simple & Safe firewall ruleset.
# Allows the libvirt default NAT bridge (virbr0) to provide DNS/DHCP
# and forward VM traffic while keeping unsolicited host input dropped.

destroy table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state { established, related } accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    meta l4proto { icmp, icmpv6 } accept comment "allow icmp"

    iifname "virbr0" udp dport { 53, 67 } accept comment "allow libvirt DNS/DHCP"
    iifname "virbr0" tcp dport 53 accept comment "allow libvirt DNS TCP"

    iifname "waydroid0" udp dport { 53, 67 } accept comment "allow Waydroid DNS/DHCP"
    iifname "waydroid0" tcp dport { 53, 67 } accept comment "allow Waydroid DNS/DHCP TCP"

    # Tailnet é rede confiável: o backup restic e o acesso remoto passam por ela.
    iifname "tailscale0" accept comment "allow tailnet"
    # Sem esta porta o Tailscale não fecha caminho direto e cai no relay DERP,
    # o que derruba a banda do backup.
    udp dport 41641 accept comment "allow tailscale direct path"

    # SSH só pela tailnet. A regra anterior era `tcp dport ssh accept` sem
    # restrição de interface: se o sshd fosse habilitado, ficaria exposto em
    # qualquer rede conectada, inclusive Wi-Fi público.
    iifname "tailscale0" tcp dport ssh accept comment "allow sshd via tailnet"

    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }

  chain forward {
    type filter hook forward priority filter
    policy drop

    iifname "virbr0" accept comment "allow VM outbound traffic"
    oifname "virbr0" ct state { established, related } accept comment "allow VM return traffic"
    iifname "waydroid0" accept comment "allow Waydroid outbound traffic"
    oifname "waydroid0" ct state { established, related } accept comment "allow Waydroid return traffic"
  }
}
