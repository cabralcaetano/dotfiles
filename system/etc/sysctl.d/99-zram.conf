# Tuning de VM para swap em zram (ARCH-34)
#
# Instalar com:
#   sudo install -Dm644 system/etc/sysctl.d/99-zram.conf /etc/sysctl.d/99-zram.conf
#   sudo sysctl --system
#
# Os defaults do kernel assumem swap em disco rotacional. Com swap em RAM
# comprimida (zram) as premissas mudam completamente: não há seek, a latência é
# de microssegundos e o custo real é CPU de compressão — que sobra num i7-13620H.
#
# Valores conforme ArchWiki (https://wiki.archlinux.org/title/Zram), os mesmos
# usados pelo Pop!_OS.

# 60 (default) faz o kernel preferir descartar page cache a comprimir páginas
# frias. Resultado medido nesta máquina: 6,6 GB de RAM em uso e o zram 100%
# livre, ou seja, os 4 GB de swap comprimido estavam de enfeite.
# 180 é apropriado justamente porque swap-in aqui é barato. Valores > 100 só
# fazem sentido quando o swap é mais rápido que descartar cache — que é o caso.
vm.swappiness = 180

# Readahead de swap em potência de 2 páginas. Default 3 = 8 páginas por fault,
# otimização para amortizar seek de disco. Em RAM não há seek, então isso só
# descomprime páginas que ninguém pediu. 0 = uma página por vez.
vm.page-cluster = 0

# Distância entre as marcas d'água de reclaim, em 0,01% da memória. O default
# 10 (0,1%) é apertado demais: o kernel começa a recuperar memória tarde e o
# reclaim vira síncrono, que é o que trava a interface. 125 dá folga pro kswapd
# trabalhar em background antes da pressão virar stall.
vm.watermark_scale_factor = 125

# Boost de watermark após fragmentação. Interage mal com swappiness alto,
# causando reclaim agressivo desnecessário. Desligado.
vm.watermark_boost_factor = 0
