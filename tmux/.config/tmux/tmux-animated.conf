# Overrides pra rodar sob tmux-animated (github.com/jonaburg/tmux-animated),
# NÃO pro tmux normal — carregar só via
# `tmux-animated -f ~/.config/tmux/tmux-animated.conf ...`.
source-file ~/.config/tmux/tmux.conf

# Animação desligada por padrão — Alt+N (troca de janela normal) fica sem
# efeito, igual o tmux normal. Só liga temporariamente dentro do script de
# Alt+Shift+N (ver abaixo), pro reordenamento.
set -g animation-window-switch off
set -g animation-status-highlight off

# swap-window/move-window (Alt+Shift+N) só realocam o índice — o conteúdo
# exibido não muda, então não tem "troca" pro tmux-animated animar sozinho.
# tmux-swap-window-animated.sh liga a animação, faz uma espiada rápida na
# janela deslocada e volta (disparando o slide), e desliga de novo. Não
# dá pra fazer isso só com if-shell: #{window_index} não expande dentro
# da ação de se-shell/if-shell (só na condição -F), só em comandos com
# expansão explícita (run-shell, display-message -F).
bind-key -n M-! run-shell "tmux-swap-window-animated.sh 1"
bind-key -n M-@ run-shell "tmux-swap-window-animated.sh 2"
bind-key -n M-# run-shell "tmux-swap-window-animated.sh 3"
bind-key -n "M-\$" run-shell "tmux-swap-window-animated.sh 4"
bind-key -n M-% run-shell "tmux-swap-window-animated.sh 5"
bind-key -n M-^ run-shell "tmux-swap-window-animated.sh 6"
bind-key -n M-& run-shell "tmux-swap-window-animated.sh 7"
bind-key -n "M-*" run-shell "tmux-swap-window-animated.sh 8"
bind-key -n M-( run-shell "tmux-swap-window-animated.sh 9"
bind-key -n M-) run-shell "tmux-swap-window-animated.sh 10"
