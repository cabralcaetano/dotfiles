# === Truecolor ===
# necessário pro tmux-power (cores em hex) renderizar certo
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# === Mouse ===
# tmux precisa capturar a rodinha para rolar o histórico do pane. Sem isso,
# o Ghostty/tmux em alternate screen traduz o scroll para Up/Down e o shell
# navega pelo histórico de comandos.
set -g mouse on

# Scroll funcional no histórico do pane. No tmux, esse scroll é implementado
# via copy-mode; não há scrollback do pane sem copy-mode. "-e" faz o copy-mode
# ser transparente: sobe a tela igual navegador/outros apps e volta sozinho ao
# normal quando o scroll chega no final do histórico. "-H" esconde o
# indicador de posição ("[40/311]") que o tmux mostra no canto por padrão.
bind-key -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e -H"

# Selecionar com o mouse (arrastar) também entra em copy-mode por baixo dos
# panos — é o default do tmux (MouseDrag1Pane), sem isso não existe seleção
# de mouse. "-H" esconde o indicador de posição, mesma razão do WheelUpPane
# acima.
bind-key -n MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -M -H"
# === Copy mode ===
set-window-option -g mode-keys vi

# prefix + [ entra em copy-mode (default do tmux); Alt+C é atalho direto,
# sem prefixo, seguindo o padrão dos outros binds (Ctrl+T/W, Ctrl+Shift+T)
# dentro do copy-mode: c inicia seleção, v copia sem sair, y copia e sai,
# q sai, hjkl/setas navegam
bind-key -n M-c copy-mode

bind-key -T copy-mode-vi c send-keys -X begin-selection
bind-key -T copy-mode-vi v send-keys -X copy-pipe "wl-copy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi q send-keys -X cancel

# Ctrl+Shift+C = mesmo efeito do "y", pra manter o atalho universal de
# terminal. Só funciona porque a tecla foi desbindada no Ghostty (lá ela
# copiaria a seleção *do Ghostty*, que é sempre vazia com mouse on) e porque
# extended-keys está ligado — sem isso o tmux não distingue C-S-c de C-c.
bind-key -T copy-mode-vi C-S-c send-keys -X copy-pipe-and-cancel "wl-copy"
# fora do copy-mode a tecla é engolida de propósito: sem bind, o tmux
# repassaria pro shell degradando C-S-c para C-c (SIGINT no processo em foco).
bind-key -n C-S-c run-shell ""

# Selecionar com o mouse (arrastar) só marca o texto — não copia sozinho.
# Default do tmux nesse evento seria copy-selection-and-cancel (copia pro
# buffer interno e sai do copy-mode assim que solta o botão); desbindado pra
# poder ajustar a seleção e só copiar de propósito com "y" (ou "v" sem sair).
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# === Abas (windows) ===
# extended-keys: sem isso o tmux não distingue Ctrl+T de Ctrl+Shift+T
set -s extended-keys on
# janelas numeradas a partir de 1, pra bater com Alt+1..Alt+0 abaixo
set -g base-index 1

# ao fechar uma janela, as seguintes deslizam pra preencher o buraco
# (ex: fecho a 2, a 3 vira 2); janela nova sempre entra no final com o
# próximo número livre, nunca é inserida no meio da sequência
set -g renumber-windows on

# Ctrl+T/Ctrl+W sem shift — sem prefixo, direto. Ghostty não usa essas teclas
# nativamente (só Ctrl+Shift+T/W, que foram desbindadas lá — ver
# ghostty/config, hoje sem uso, exceto Ctrl+Shift+T abaixo). Ctrl+W deixa de
# apagar palavra no prompt (unix-word-rubout do readline) de propósito —
# trade-off aceito.
bind-key -n C-t new-window

# Ctrl+W empilha diretório/comando/nome da janela em
# ~/.tmux/closed-windows.stack (tmux-close-window.sh) antes de fechar;
# Ctrl+Shift+T desempilha e reabre nesse diretório, rerodando o comando se
# não era só o shell (tmux-reopen-window.sh). Não restaura scrollback nem
# estado do processo em si — só diretório + comando. Scripts em
# scripts/.local/bin/, já em $PATH via ~/.local/bin.
bind-key -n C-w run-shell "tmux-close-window.sh '#{pane_current_path}' '#{pane_pid}' '#{window_name}'" \; kill-window
bind-key -n C-S-t run-shell "tmux-reopen-window.sh"

# Alt+1..9 e Alt+0 (janela 10) navegam direto entre abas
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9
bind-key -n M-0 select-window -t :10

# Alt+Shift+1..9 e Alt+Shift+0 realocam a janela atual pro slot N (igual
# Win+Shift+workspace no Hyprland). Bind é no caractere resultante do Shift
# (layout US), não em "M-S-1": o teclado já resolve Shift+1 pra "!" antes de
# chegar no tmux (confirmado via wev — sym reportado é "exclam"/"at"/etc, não
# "1" com flag de shift), então "M-S-1" nunca bate com nada.
#
# Se o slot N já tem janela, troca de lugar (swap-window); se não tem, cria
# a janela nova ali (move-window — swap-window sozinho dá erro em slot
# vazio). "N <= session_windows" serve de teste de existência porque
# renumber-windows on (acima) garante índices sempre contíguos, sem buracos.
bind-key -n M-! if-shell -F "#{<=:1,#{session_windows}}" "swap-window -t :1" "move-window -t :1"
bind-key -n M-@ if-shell -F "#{<=:2,#{session_windows}}" "swap-window -t :2" "move-window -t :2"
bind-key -n M-# if-shell -F "#{<=:3,#{session_windows}}" "swap-window -t :3" "move-window -t :3"
bind-key -n "M-\$" if-shell -F "#{<=:4,#{session_windows}}" "swap-window -t :4" "move-window -t :4"
bind-key -n M-% if-shell -F "#{<=:5,#{session_windows}}" "swap-window -t :5" "move-window -t :5"
bind-key -n M-^ if-shell -F "#{<=:6,#{session_windows}}" "swap-window -t :6" "move-window -t :6"
bind-key -n M-& if-shell -F "#{<=:7,#{session_windows}}" "swap-window -t :7" "move-window -t :7"
bind-key -n "M-*" if-shell -F "#{<=:8,#{session_windows}}" "swap-window -t :8" "move-window -t :8"
bind-key -n M-( if-shell -F "#{<=:9,#{session_windows}}" "swap-window -t :9" "move-window -t :9"
bind-key -n M-) if-shell -F "#{<=:10,#{session_windows}}" "swap-window -t :10" "move-window -t :10"

# === Status bar (tema) ===
set -g status-position top
set -g status-interval 1

# tmux-power (github.com/wfxr/tmux-power) — cores custom em vez de preset,
# pra bater com a paleta já usada no Ghostty/Waybar/Hyprlock:
# fundo #1d1d20, texto #deddda, cinza de destaque #a0a0a0
set -g @tmux_power_theme '#a0a0a0'
set -g @tmux_power_g0 "#1d1d20"
set -g @tmux_power_g1 "#2a2a2e"
set -g @tmux_power_g2 "#3a3a3e"
set -g @tmux_power_g3 "#54545a"
set -g @tmux_power_g4 "#6e6e76"
# Tema gerado por theme-set.sh. Mantém defaults acima para primeira execução,
# e sobrescreve quando existir um tema ativo.
if-shell "[ -f ~/.config/tmux/theme.conf ]" "source-file ~/.config/tmux/theme.conf"


set -g @tmux_power_left_a '  #S'
set -g @tmux_power_left_b ''
# lado direito vazio por enquanto — hora/data e diretório+branch já ficam
# redundantes com Waybar/Starship; ainda sem decidir o que colocar aqui
set -g @tmux_power_right_y ''
set -g @tmux_power_right_z ''

# === TPM (tmux plugin manager) ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-power'

# resurrect/continuum: salva sessões (janelas, panes, comando rodando em cada
# pane) periodicamente (continuum, a cada 15min) para permitir restauração
# manual (prefix + ctrl-r) após desligamento inesperado. Restauração
# automática ao abrir o tmux fica desligada (continuum-restore 'off').
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'

# manter esta linha por último
run '~/.tmux/plugins/tpm/tpm'
