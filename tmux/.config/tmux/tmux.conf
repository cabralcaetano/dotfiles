# === Truecolor ===
# necessário pro tmux-power (cores em hex) renderizar certo
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# === Mouse ===
# scroll da rodinha funciona normal (entra em copy-mode sozinho ao rolar pra
# cima quando o app não trata mouse — é o que deixa dar scroll no histórico
# do shell; sai sozinho ao voltar ao final); clique/drag também funcionam
set -g mouse on

# explícito em vez de depender do default do tmux — bind-key não é
# retroativo (recarregar o conf sem essa linha não desfaz um override já
# aplicado numa sessão viva), então fica documentado o comportamento certo
bind-key -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e"

# === Copy mode ===
set-window-option -g mode-keys vi

# prefix + [ entra em copy mode (default do tmux)
# dentro do copy mode: v inicia seleção, y copia e sai, hjkl/setas navegam

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# === Abas (windows) ===
# extended-keys: sem isso o tmux não distingue Ctrl+T de Ctrl+Shift+T
set -s extended-keys on
# janelas numeradas a partir de 1, pra bater com Alt+1..Alt+0 abaixo
set -g base-index 1

# ao fechar uma janela, as seguintes deslizam pra preencher o buraco
# (ex: fecho a 2, a 3 vira 2); janela nova sempre entra no final com o
# próximo número livre, nunca é inserida no meio da sequência
set -g renumber-windows on

# mesmas teclas que o Ghostty usava para aba nova/fechar (agora desbindadas
# lá — ver ghostty/config) — sem prefixo, direto
bind-key -n C-S-t new-window
bind-key -n C-S-w kill-window

# Alt+1..9 e Alt+0 (janela 10) navegam direto entre abas
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9
bind-key -n M-0 select-window -t :10

# Alt+Shift+1..9 e Alt+Shift+0 realocam a janela atual pro slot N (igual
# Win+Shift+workspace no Hyprland). Bind é no caractere resultante do Shift
# (layout US), não em "M-S-1": o teclado já resolve Shift+1 pra "!" antes de
# chegar no tmux (confirmado via wev — sym reportado é "exclam"/"at"/etc, não
# "1" com flag de shift), então "M-S-1" nunca bate com nada.
#
# Se o slot N já tem janela, troca de lugar (swap-window); se não tem, cria
# a janela nova ali (move-window — swap-window sozinho dá erro em slot
# vazio). "N <= session_windows" serve de teste de existência porque
# renumber-windows on (acima) garante índices sempre contíguos, sem buracos.
bind-key -n M-! if-shell -F "#{<=:1,#{session_windows}}" "swap-window -t :1" "move-window -t :1"
bind-key -n M-@ if-shell -F "#{<=:2,#{session_windows}}" "swap-window -t :2" "move-window -t :2"
bind-key -n M-# if-shell -F "#{<=:3,#{session_windows}}" "swap-window -t :3" "move-window -t :3"
bind-key -n "M-\$" if-shell -F "#{<=:4,#{session_windows}}" "swap-window -t :4" "move-window -t :4"
bind-key -n M-% if-shell -F "#{<=:5,#{session_windows}}" "swap-window -t :5" "move-window -t :5"
bind-key -n M-^ if-shell -F "#{<=:6,#{session_windows}}" "swap-window -t :6" "move-window -t :6"
bind-key -n M-& if-shell -F "#{<=:7,#{session_windows}}" "swap-window -t :7" "move-window -t :7"
bind-key -n "M-*" if-shell -F "#{<=:8,#{session_windows}}" "swap-window -t :8" "move-window -t :8"
bind-key -n M-( if-shell -F "#{<=:9,#{session_windows}}" "swap-window -t :9" "move-window -t :9"
bind-key -n M-) if-shell -F "#{<=:10,#{session_windows}}" "swap-window -t :10" "move-window -t :10"

# === Status bar (tema) ===
set -g status-position top
set -g status-interval 1

# tmux-power (github.com/wfxr/tmux-power) — cores custom em vez de preset,
# pra bater com a paleta já usada no Ghostty/Waybar/Hyprlock:
# fundo #1d1d20, texto #deddda, cinza de destaque #a0a0a0
set -g @tmux_power_theme '#a0a0a0'
set -g @tmux_power_g0 "#1d1d20"
set -g @tmux_power_g1 "#2a2a2e"
set -g @tmux_power_g2 "#3a3a3e"
set -g @tmux_power_g3 "#54545a"
set -g @tmux_power_g4 "#6e6e76"

set -g @tmux_power_left_a '  #S'
set -g @tmux_power_left_b ''
# lado direito vazio por enquanto — hora/data e diretório+branch já ficam
# redundantes com Waybar/Starship; ainda sem decidir o que colocar aqui
set -g @tmux_power_right_y ''
set -g @tmux_power_right_z ''

# === TPM (tmux plugin manager) ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-power'

# manter esta linha por último
run '~/.tmux/plugins/tpm/tpm'
