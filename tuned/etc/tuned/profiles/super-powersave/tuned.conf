#
# tuned configuration
#
# Perfil custom "Super Economia" — não existe no pacote tuned. Herda o
# `powersave` stock (governor/EPP/audio/sysctl/script de WiFi power-save)
# via include e empilha mais alavancas exclusivas do modo mais extremo:
#
# - [cpu] max_perf_pct=50 — capa o clock não-turbo em metade do máximo.
#   Opção nativa do plugin cpu (min_perf_pct/max_perf_pct/no_turbo), não
#   setada nem por `powersave` nem por `balanced-battery` stock.
# - [usb] autosuspend=1 — plugin nativo, força autosuspend=1s em todo
#   dispositivo USB. NÃO uso a variável USB_AUTOSUSPEND que o
#   powersave/script.sh checa: essa variável, se declarada num
#   [variables], vira env var `TUNED_USB_AUTOSUSPEND` (prefixo
#   `consts.ENV_PREFIX`), nunca a `USB_AUTOSUSPEND` sem prefixo que o
#   script realmente lê — é código morto no tuned stock. `[usb]`
#   autosuspend é o plugin real e testado.
# - [script] script.sh próprio (abaixo, mesmo diretório) — bloqueia
#   Bluetooth via rfkill só neste perfil; tuned chama `stop()` sozinho ao
#   trocar de perfil, desbloqueando automaticamente. Dois `[script]` no
#   mesmo profile (o herdado de powersave + este) são concatenados pelo
#   merger do tuned (caso especial em profiles/merger.py), os dois rodam.
# - [sysfs] soma PCIe ASPM `powersave` (ver nota anterior sobre não haver
#   plugin nativo `pcie_aspm`) + teto de latência NVMe APST mais permissivo
#   (permite estados de energia mais profundos do SSD).
#
# `${i:PROFILE_DIR}/script.sh` do `powersave` incluído resolve pro
# diretório dele mesmo (expansão acontece na carga do arquivo de origem,
# antes do merge do include), então não precisa copiar esse script.sh
# aqui — só o novo, de Bluetooth.
#

[main]
summary=Maxima economia de bateria
include=powersave

[cpu]
max_perf_pct=50

[usb]
autosuspend=1

[script]
script=${i:PROFILE_DIR}/script.sh

[sysfs]
/sys/module/pcie_aspm/parameters/policy=powersave
/sys/module/nvme_core/parameters/default_ps_max_latency_us=200000
