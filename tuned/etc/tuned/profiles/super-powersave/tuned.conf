#
# tuned configuration
#
# Perfil custom "Super Economia" — não existe no pacote tuned. Herda o
# `powersave` stock (governor/EPP/audio/sysctl/script de WiFi power-save)
# via include e adiciona [pcie_aspm] policy=powersave, que nem `powersave`
# nem `balanced-battery` stock setam (ficam em "default", herdado do
# firmware). `${i:PROFILE_DIR}/script.sh` do `powersave` incluído resolve
# pro diretório dele mesmo (expansão acontece na carga do arquivo de origem,
# antes do merge do include), então não precisa copiar script.sh aqui.
#

[main]
summary=Maxima economia de bateria
include=powersave

[pcie_aspm]
policy=powersave
