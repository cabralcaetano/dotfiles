#
# tuned configuration
#
# Perfil custom "Super Economia" — não existe no pacote tuned. Herda o
# `powersave` stock (governor/EPP/audio/sysctl/script de WiFi power-save)
# via include e adiciona PCIe ASPM policy=powersave via [sysfs] (plugin
# genérico) — tuned NÃO tem plugin nativo `pcie_aspm`, só existe
# `plugin_sysfs.py` pra escrever caminhos arbitrários em /sys. Nem
# `powersave` nem `balanced-battery` stock tocam nisso (ficam em
# "default", herdado do firmware). `${i:PROFILE_DIR}/script.sh` do
# `powersave` incluído resolve pro diretório dele mesmo (expansão
# acontece na carga do arquivo de origem, antes do merge do include),
# então não precisa copiar script.sh aqui.
#

[main]
summary=Maxima economia de bateria
include=powersave

[sysfs]
/sys/module/pcie_aspm/parameters/policy=powersave
