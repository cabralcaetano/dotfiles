#
# tuned configuration
#
# Override local do perfil stock `balanced-battery` (pacote `tuned`) — mesmo
# perfil que é o padrão diário (Waybar), com [pcie_aspm] policy=powersave
# adicionado. Original em /usr/lib/tuned/profiles/balanced-battery/tuned.conf
# não toca ASPM (herda "default" via include=balanced).

[main]
summary=Balanced profile biased towards power savings changes for battery
include=balanced

[cpu]
energy_performance_preference=balance_power
boost=1

[video]
panel_power_savings=1

[pcie_aspm]
policy=powersave
