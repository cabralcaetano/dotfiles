# === Fonte ===
font_family      JetBrainsMono Nerd Font
font_size        13.0

# === Tema ===
include current-theme.conf

# === Transparência ===
background_opacity 0.85
background_blur    0

# === Janela ===
window_padding_width  8 12

# === Cursor ===
cursor_shape      beam
cursor_blink_interval 0.5

# === Scrollback ===
scrollback_lines  10000

# === Wayland ===
linux_display_server wayland

map shift+up    send_text all \x1b[1;2A
map shift+down  send_text all \x1b[1;2B
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# === Teclado moderno ===
kitty_mod ctrl+shift
map shift+left  no-op
map shift+right no-op
modify_font_size  0

# === Protocolo de teclado ===
forward_stdio_to_child no

# === kitty-scrollback.nvim — abre o scrollback inteiro no Neovim (busca/seleção/copy via keyboard) ===
allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled

action_alias kitty_scrollback_nvim kitten /home/caetano/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
